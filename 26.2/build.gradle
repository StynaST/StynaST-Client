plugins {
    id 'net.neoforged.moddev' version '2.0.146' apply false
    id 'net.fabricmc.fabric-loom' version '1.17-SNAPSHOT' apply false
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

tasks.register('publishRelease', PublishForgejoRelease) {
    group = 'publishing'
    description = 'Builds Fabric + NeoForge and uploads them as a Forgejo release.'
    dependsOn ':fabric:build', ':neoforge:build'
    serverUrl = 'https://code.styna.net'
    repo = 'Minecraft/StynaST-Client'
    tag = "v${mod_version}+${minecraft_version}"
    repoDir = layout.projectDirectory
    jars.from(['fabric', 'neoforge'].collect { "$it/build/libs/StynaSTMC-${mod_version}+${minecraft_version}-${it}.jar" })
}
