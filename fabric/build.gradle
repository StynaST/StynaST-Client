plugins {
    id 'multiloader-loader'
    id 'net.fabricmc.fabric-loom'
}

configurations {
    localRuntime
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    compileOnly "com.terraformersmc:modmenu:${modmenu_version}"
    localRuntime "com.terraformersmc:modmenu:${modmenu_version}"
    localRuntime "maven.modrinth:flashback:${flashback_version}"
}

loom {
    def ct = file("src/main/resources/${mod_id}.classtweaker")
    if (ct.exists()) {
        accessWidenerPath = ct
    }
    runs {
        client {
            client()
            configName = 'Fabric Client'
            ideConfigGenerated(true)
            runDir 'run-fabric'
        }
        server {
            server()
            configName = 'Fabric Server'
            ideConfigGenerated(true)
            runDir 'run-fabric/server'
        }
    }
}

processResources {
    exclude 'META-INF/accesstransformer.cfg'
}
