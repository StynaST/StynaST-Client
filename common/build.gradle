plugins {
    id 'multiloader-common'
    id 'net.neoforged.moddev'
}

neoForge {
    neoFormVersion = neo_form_version
    accessTransformers.from(file('src/main/resources/META-INF/accesstransformer.cfg'))
    validateAccessTransformers = true
}

dependencies {
    // Both loaders ship Mixin and MixinExtras at runtime.
    compileOnly "net.fabricmc:sponge-mixin:${mixin_version}"
    compileOnly "io.github.llamalad7:mixinextras-common:${mixinextras_version}"
    annotationProcessor "io.github.llamalad7:mixinextras-common:${mixinextras_version}"
}

def buildFlags = tasks.register('generateBuildFlags', GenerateBuildFlags) {
    freecam = providers.gradleProperty('freecam').map { it.toBoolean() }.orElse(true)
    outputDir = layout.buildDirectory.dir('generated/sources/buildFlags')
}
sourceSets.main.java.srcDir(buildFlags)

configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

artifacts {
    commonJava file('src/main/java')
    commonJava(buildFlags.flatMap { it.outputDir }) { builtBy buildFlags }
    commonResources sourceSets.main.resources.sourceDirectories.singleFile
}
